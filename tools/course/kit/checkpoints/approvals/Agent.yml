# Acme support: the agent this course builds, lesson by lesson.
name: acme-support
description: Answers questions about orders, returns and shipping for Acme.
provider: openai-compatible
model: fast-model
usage: true

environments:
  test:
    model: mock/mock-model

tools:
  - now@bxai

profiles:
  fast:
    description: Quick answers for simple questions
    provider: openai-compatible
    model: fast-model
  planner:
    description: Thinks it through before it answers
    provider: openai-compatible
    model: planner-model

routines:
  enabled: true
  minInterval: 1m
