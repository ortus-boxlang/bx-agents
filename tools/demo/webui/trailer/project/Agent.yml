name: acme-support
description: Orders, returns and shipping for Acme
profiles:
  fast:
    description: Quick answers for simple questions
    provider: openai-compatible
    model: fast-model
    contextWindow: 8000
  planner:
    description: Thinks it through before it answers
    provider: openai-compatible
    model: planner-model
    contextWindow: 8000
defaultProfile: fast
contextWindow: 8000
usage: true
notes: {}

tools:
  - now@bxai

agentApi:
  tokens: true
  tokenEnvVar: TRAILER_ADMIN_TOKEN
  manageTokens: true
  profiles: [ fast, planner ]

routines:
  enabled: true
  timezone: UTC

subAgents: [ researcher, writer ]
