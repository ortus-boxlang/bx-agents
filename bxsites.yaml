name: "BxAgents"
description: "A conventions-based framework for building AI agents powered by BoxLang AI - build AI agents by convention."
baseURL: "https://bxagents.ai/"
theme:
  name: bootstrap
  options: { navCollapsible: true, navExpandAll: false, tocPosition: sticky }
  logo: assets/logo.svg
  favicon: assets/favicon.svg
search: true
# Emits mcp-index.json/mcp-nav.json alongside the site, so an MCP client can
# discover and read these docs as a tool rather than scraping the HTML. This is
# the documentation for an agent framework - the agents ought to be able to read
# it.
mcp: true
versions:
  default: "1.0.x"
i18n:
  # Stated explicitly rather than leaning on the built-in default, so the
  # language switcher always carries a real "English" entry alongside the
  # translations.
  defaultLocale: { code: en, label: English }
  # Only locales that are actually complete belong here. bx-sites discovers a
  # locale from the tree it is BUILDING - with `versions.default` set, that is
  # `docs/versions/1.0.x/i18n/<code>/`, NOT `docs/i18n/<code>/`, which only ever
  # feeds the unpublished-locale `/next/` preview. German and Japanese are
  # parked under `translations-wip/` until they reach parity; listing an
  # incomplete locale here only produces a language switcher that 404s.
  locales:
    - { code: es, label: Español }
# Reusable `{{ dotted.path }}` values, so the ecosystem links are defined once
# here instead of drifting page by page.
variables:
  boxlang:
    url: "https://www.boxlang.io"
    ai: "https://ai.boxlang.io"
    docs: "https://boxlang.ortusbooks.com"
  coldbox:
    url: "https://www.coldbox.org"
    docs: "https://coldbox.ortusbooks.com"
  ortus:
    url: "https://www.ortussolutions.com"
    slack: "https://www.ortussolutions.com/community/slack"
markdown:
  enableFootnotes: true
  enableDefinitionLists: true
repo:
  url: "https://github.com/ortus-boxlang/bx-agents"
  editUri: "edit/development/docs/"
social:
  - { url: "https://github.com/ortus-boxlang/bx-agents", icon: github, label: "BxAgents on GitHub" }
  - { url: "https://www.ortussolutions.com/community/slack", icon: slack, label: "Slack Community" }
  - { url: "https://x.com/TryBoxLang", icon: twitter, label: "X (Twitter)" }
footer: true
lastUpdated: true
mermaid: true
ogImage: assets/home-banner.jpg
generateOgImages: true
pageActions: true
extraCss: [ assets/bx-agents.css ]
