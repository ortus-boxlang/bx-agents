# The agent the web UI is developed and tested against. The model is scripted (ui/dev/model.json, served by
# tools/demo/fakellm.bxs), so nothing here needs a key or the network.
name: ui-dev
description: The agent the web UI is developed and tested against

profiles:
  fast:
    description: Quick answers for simple questions
    provider: openai-compatible
    model: fast-model
    contextWindow: 8000
  planner:
    description: Thinks it through before it answers
    provider: openai-compatible
    model: planner-model
    contextWindow: 8000

defaultProfile: fast

subAgents: [ helper ]

tools:
  - now@bxai

notes:
  provider: sqlite

vault: {}

routines:
  enabled: true

agentApi:
  enabled: true
