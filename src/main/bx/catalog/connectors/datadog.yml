id: datadog
name: Datadog
icon: pulse
category: Developer
summary: Search logs, metrics, traces, monitors and dashboards in Datadog
transport: http
url: https://{site}/v1/mcp
options:
  - key: site
    label: Datadog site
    help: The MCP address for the site where your Datadog organization is hosted. Check the address you use to sign in to Datadog.
    type: text
    target: host
    choices:
      - { value: mcp.datadoghq.com, label: US1 }
      - { value: mcp.us3.datadoghq.com, label: US3 }
      - { value: mcp.us5.datadoghq.com, label: US5 }
      - { value: mcp.datadoghq.eu, label: EU1 }
      - { value: mcp.ap1.datadoghq.com, label: AP1 }
      - { value: mcp.ap2.datadoghq.com, label: AP2 }
      - { value: mcp.uk1.datadoghq.com, label: UK1 }
    default: mcp.datadoghq.com
auth:
  - type: oauth
    verified: true
  - type: bearer
    envVar: DATADOG_MCP_TOKEN
    help: A Personal Access Token or Service Access Token made in Datadog. It is sent as a bearer token.
    verified: true
risk: medium
riskNote: Reads logs, metrics, traces and other observability data, and some tools can change things such as dashboards, notebooks and monitors in the person's organization. Access follows the person's Datadog permissions.
docs: https://docs.datadoghq.com/mcp_server/setup/
verifiedOn: 2026-11-27
