id: box
name: Box
icon: folder
category: Productivity
summary: Search and read files and folders, ask Box AI, create folders and comments
transport: http
url: https://mcp.box.com
auth:
  - type: oauth
    app: own
    scopes: [ root_readwrite, ai.readwrite ]
    envVars:
      clientId: BOX_CLIENT_ID
      clientSecret: BOX_CLIENT_SECRET
    help: A Box admin opens Integrations in the Admin Console, configures the Box MCP server, adds Integration Credentials, copies the client id and secret, enters the redirect address (the public address of this app followed by /__bxagents/connect/callback) and selects the access scopes. Box also lists docgen.readwrite, which needs an Enterprise Advanced license.
    verified: true
risk: medium
riskNote: Can create folders, comments and new file versions, and some tools can change file properties or create shared links. Tools that write are off by default in Box. People can only reach content they already have access to.
docs: https://developer.box.com/guides/box-mcp/remote/
verifiedOn: 2026-11-27
