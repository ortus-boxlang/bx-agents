id: git
name: Git
icon: git-fork
summary: Read, search and change local Git repositories
transport: stdio
command: [ uvx, "mcp-server-git==2026.11.11" ]
requires:
  program: uvx
  help: Install uv (https://docs.astral.sh/uv/) so the agent can start this server. It runs on the machine the agent runs on, in the folder you start the agent from.
auth:
  - type: none
    verified: true
options:
  - key: repository
    label: Repository
    help: A path inside a Git working tree. The server then works only in that repository. Left empty, it can read and write any repository the process can reach.
    type: text
    target: arg
    name: --repository
    default: ""
risk: medium
riskNote: Can add, reset, commit, merge and switch branches. Described by its authors as in early development. Without a repository set it can reach every repository the process can.
docs: https://github.com/modelcontextprotocol/servers/tree/main/src/git
verifiedOn: 2026-11-17
