id: canva
name: Canva
icon: palette
category: Productivity
summary: Create, find, edit, comment on and export Canva designs and assets
transport: http
url: https://api.canva.com/connect/v1/mcp
auth:
  - type: oauth
    app: own
    scopes: [ "profile:read", "design:meta:read", "design:content:read", "design:content:write", "folder:read", "folder:write", "brandtemplate:meta:read", "brandtemplate:content:read", "brandtemplate:content:write", "comment:read", "comment:write", "asset:read", "asset:write", "brandkit:read", "help:answers:read", "help:answers:write" ]
    envVars:
      clientId: CANVA_CLIENT_ID
      clientSecret: CANVA_CLIENT_SECRET
    help: In the Canva Developer Portal create an app, open Outside Canva, turn on Canva MCP under Integration methods, copy the client id, generate a client secret, and add the redirect address (the public address of this app followed by /__bxagents/connect/callback) under Redirect URLs. Each person signs in with their own Canva account.
    verified: true
risk: medium
riskNote: Can create and edit designs, upload assets, add comments and move items between folders in the person's own Canva account.
docs: https://www.canva.dev/blog/developers/canva-mcp-ga/
verifiedOn: 2026-11-27
