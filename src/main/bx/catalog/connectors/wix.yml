id: wix
name: Wix
icon: layout
category: Apps
summary: Search Wix documentation and make API calls on your Wix sites
transport: http
url: https://mcp.wix.com/mcp
auth:
  - type: oauth
    scopes: [ offline_access ]
    verified: true
  - type: bearer
    envVar: WIX_API_KEY
    header: Authorization
    prefix: ""
    help: Make an API key in your Wix account (API Keys page in the Wix developer docs) and paste it here. The key is sent alone, without Bearer. Also fill in your Wix account ID below.
    verified: true
options:
  - key: wix_account_id
    label: Wix account ID
    help: The ID of your Wix account. Needed with an API key.
    type: text
    target: header
    name: wix-account-id
    onlyWith: bearer
risk: high
riskNote: Can change site content, store data and other settings through the Wix APIs, including on a live site.
docs: https://dev.wix.com/docs/sdk/articles/use-the-wix-mcp/about-the-wix-mcp.md
verifiedOn: 2026-11-27
