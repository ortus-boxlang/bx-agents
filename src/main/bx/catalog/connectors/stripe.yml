id: stripe
name: Stripe
icon: tag
category: Finance
summary: Customers, invoices, subscriptions, refunds and documentation search
transport: http
url: https://mcp.stripe.com
auth:
  - type: oauth
    scopes: [ mcp ]
    verified: true
  - type: bearer
    envVar: STRIPE_AGENT_API_KEY
    help: An agent API key with the smallest set of permissions. Use a sandbox account first. Stripe stops accepting full-access secret keys and restricted keys without the Agent tag on 2026-11-30.
    verified: true
options:
  - key: connectedAccount
    label: Connected account
    help: The id of a connected account (acct_...) to act as. Platform agent API keys only; OAuth cannot act as a connected account.
    type: text
    target: header
    name: Stripe-Account
    default: ""
    onlyWith: bearer
risk: high
riskNote: Moves money. Its write tool covers POST, PATCH, PUT and DELETE. Stripe asks for human confirmation on refunds and outbound payments.
docs: https://docs.stripe.com/mcp
verifiedOn: 2026-11-14
