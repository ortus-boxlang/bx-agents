id: daloopa
name: Daloopa
icon: chart-line-up
category: Finance
summary: Company financials, KPIs, filings and earnings transcripts
transport: http
url: https://mcp.daloopa.com/server/mcp
auth:
  - type: oauth
    verified: true
  - type: bearer
    envVar: DALOOPA_API_KEY
    header: X-API-KEY
    prefix: ""
    help: Use your Daloopa API key. Daloopa sales or support gives you one. The key is sent as is, with no token step.
    verified: true
risk: low
riskNote: Reads financial data, filings and stock prices. It cannot change anything. You need a Daloopa account.
docs: https://docs.daloopa.com/docs/mcp-authentication.md
verifiedOn: 2026-11-27
