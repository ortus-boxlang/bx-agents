id: supabase
name: Supabase
icon: database
summary: Database, SQL, migrations, projects and branches
transport: http
url: https://mcp.supabase.com/mcp
auth:
  - type: oauth
    verified: true
  - type: bearer
    envVar: SUPABASE_ACCESS_TOKEN
    help: A personal access token.
    verified: true
options:
  - key: project_ref
    label: Project
    help: Limits the connector to one project and turns off the account tools.
    type: text
    target: query
    name: project_ref
    default: ""
  - key: read_only
    label: Read only
    help: Runs queries as a read only Postgres user. On by default.
    type: boolean
    target: query
    name: read_only
    default: true
  - key: features
    label: Tool groups
    help: A comma separated list of the tool groups to enable. Left empty, the server's default groups are used.
    type: text
    target: query
    name: features
    default: ""
risk: high
riskNote: Runs SQL and migrations and can create paid projects. Read only is on by default; add a project to limit it to one. Table data can carry prompt injection, so never give it to end users.
docs: https://supabase.com/docs/guides/getting-started/mcp
verifiedOn: 2026-11-14
