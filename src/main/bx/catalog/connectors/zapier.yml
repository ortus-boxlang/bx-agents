id: zapier
name: Zapier
icon: lightning
category: Apps
summary: Run actions in the apps connected to your Zapier account
transport: http
url: https://mcp.zapier.com/api/v1/connect
auth:
  - type: oauth
    verified: true
  - type: bearer
    envVar: ZAPIER_MCP_TOKEN
    help: A connection token. Create a server at mcp.zapier.com, then generate its token. It is shown once and stays valid until you regenerate it.
    verified: true
risk: high
riskNote: Can run any action you enable in Zapier, such as sending email and messages or changing records in other apps. Enable only the actions you need.
docs: https://docs.zapier.com/mcp/overview/how-connections-work.md
verifiedOn: 2026-11-26
