id: slack
name: Slack
icon: slack-logo
category: Productivity
summary: Search channels and people, read threads, send messages, canvases, files and lists
transport: http
url: https://mcp.slack.com/mcp
auth:
  - type: bearer
    envVar: SLACK_MCP_TOKEN
    help: A Slack user token (xoxp-...) of a Slack app that is internal to your workspace or published in the Slack Marketplace, with only the scopes the agent needs (docs.slack.dev lists the scopes of each tool). Slack does not accept dynamic client registration, so there is no sign in, and an app that is neither internal nor published is refused.
    verified: false
    unverifiedNote: Slack's server answers 401 without a token and its documentation names user tokens, but a call with a real token was not tried here, and the documentation does not say in so many words that a token made by hand is accepted as a bearer token.
risk: high
riskNote: Can send and schedule messages as the person, add reactions, create channels and canvases, upload files and read private channels and direct messages the token reaches. Use a test workspace first, and give the token read scopes only to start with.
docs: https://docs.slack.dev/ai/slack-mcp-server
verifiedOn: 2026-11-26
