id: x-ads
name: X Ads
icon: paper-plane-tilt
category: Advertising
summary: Read X Ads accounts and analytics, and create and manage campaigns
transport: http
url: https://ads-api.x.com/mcp
auth:
  - type: oauth
    app: own
    scopes: [ ads.read, ads.write, offline.access ]
    envVars:
      clientId: X_ADS_CLIENT_ID
    help: In the X Developer Console create or reuse an app with Read and Write permission, type Native App (public client, PKCE, no secret), and add the redirect address (the public address of this app followed by /__bxagents/connect/callback). Enable Ads API access under Project Access, and copy the OAuth 2.0 client id.
    verified: true
risk: high
riskNote: Can create and change campaigns, line items, audiences and creatives, and activate campaigns that spend money. New campaigns start paused.
docs: https://docs.x.com/x-ads-api/mcp
verifiedOn: 2026-11-27
