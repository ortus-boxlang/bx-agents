id: cloudflare
name: Cloudflare
icon: cloud
category: Developer
summary: "The Cloudflare API: DNS, Workers, rules and more"
transport: http
url: https://mcp.cloudflare.com/mcp
auth:
  - type: oauth
    scopes: [ user:read, account:read ]
    verified: true
  - type: bearer
    envVar: CLOUDFLARE_API_TOKEN
    help: A Cloudflare API token, user or account. Scope it to the accounts and zones the agent should touch.
    verified: true
risk: high
riskNote: Three tools (search, execute and docs) reach more than 2,500 endpoints, so turning tools on or off does not limit it. Only the scopes of the sign in or the permissions of the token do. It can change DNS, Workers and rules and create billable resources.
docs: https://developers.cloudflare.com/agents/model-context-protocol/mcp-servers-for-cloudflare/
verifiedOn: 2026-11-14
