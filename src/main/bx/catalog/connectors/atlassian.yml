id: atlassian
name: Atlassian (Jira and Confluence)
icon: list-checks
category: Productivity
summary: Jira work items, Confluence pages, Bitbucket
transport: http
url: https://mcp.atlassian.com/v2/mcp
auth:
  - type: oauth
    verified: true
  - type: bearer
    envVar: ATLASSIAN_API_TOKEN
    help: A service account API key, sent as a Bearer token. An organization admin must allow API token sign in first. Personal API tokens use Basic authentication and are not supported here. Tokens are not tied to one site and some tools are missing.
    verified: true
risk: medium
riskNote: Creates and updates work items and pages and posts comments.
docs: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/
verifiedOn: 2026-11-14
