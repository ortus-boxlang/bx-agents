id: metricool
name: Metricool
icon: chart-bar
category: Social Media
summary: Manage brands, read social analytics and schedule posts
transport: http
url: https://ai.metricool.com/mcp
auth:
  - type: oauth
    scopes: [ mcp:read, mcp:write ]
    verified: true
  - type: bearer
    envVar: METRICOOL_API_KEY
    header: X-Mc-Auth
    prefix: ""
    help: Copy your Metricool API key from Account Settings, then API (app.metricool.com/user-settings/api) and paste it here.
    verified: true
risk: high
riskNote: Can schedule and publish posts to the connected social accounts and change brand settings. Plan limits still apply.
docs: https://help.metricool.com/how-to-connect-metricools-mcp-with-claude-0l84v.md
verifiedOn: 2026-11-27
