id: linear
name: Linear
icon: kanban
category: Productivity
summary: Find, create and update issues, projects, documents and comments
transport: http
url: https://mcp.linear.app/mcp
auth:
  - type: oauth
    scopes: [ read, write ]
    verified: true
  - type: bearer
    envVar: LINEAR_API_KEY
    help: A Linear API key, or an OAuth access token from your own Linear OAuth app. A key with only the Read permission gives read-only access.
    verified: true
risk: medium
riskNote: Can create and change issues, projects, documents and comments in the workspace. Use a read-only key to limit it.
docs: https://linear.app/docs/mcp
verifiedOn: 2026-11-26
