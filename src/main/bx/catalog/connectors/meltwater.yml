id: meltwater
name: Meltwater
icon: chart-bar
category: Sales
summary: Media and social mentions, saved searches and insights from Meltwater
transport: http
url: https://api.meltwater.com/v2/mcp
auth:
  - type: oauth
    scopes: [ tools:read, tools:call ]
    verified: true
  - type: bearer
    envVar: MELTWATER_API_KEY
    header: apikey
    prefix: ""
    help: Make an API token in the Meltwater app (see API Credentials in the Meltwater developer portal) and paste it here. Your plan must include Meltwater MCP.
    verified: true
risk: low
riskNote: Reads your saved searches, tags and media and social data. Which tools you get depends on your Meltwater package.
docs: https://developer.meltwater.com/guides/meltwater-mcp/connectors/custom/
verifiedOn: 2026-11-27
