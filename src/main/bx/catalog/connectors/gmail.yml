id: gmail
name: Gmail
icon: envelope-simple
category: Productivity
summary: Search and read mail, manage drafts and labels, send, reply and forward
transport: http
url: https://gmailmcp.googleapis.com/mcp/v1
auth:
  - type: oauth
    app: own
    endpoints:
      authorize: https://accounts.google.com/o/oauth2/v2/auth
      token: https://oauth2.googleapis.com/token
      revoke: https://oauth2.googleapis.com/revoke
    params:
      access_type: offline
      prompt: consent
    scopes: [ https://www.googleapis.com/auth/gmail.readonly, https://www.googleapis.com/auth/gmail.compose, https://www.googleapis.com/auth/gmail.modify ]
    envVars:
      clientId: GOOGLE_CLIENT_ID
      clientSecret: GOOGLE_CLIENT_SECRET
    help: In the Google Cloud console (Google Auth Platform, Clients) create an OAuth client with Use this client for an AI-powered agent ticked. For the web app make it a Web application client and add the app's public address followed by /__bxagents/connect/callback as an authorized redirect address; for the terminal make it a Desktop app client, which takes any loopback address. Gmail, Calendar and Drive share the one client. Enable the API and its MCP service in the project first. Then set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET and restart the agent.
    verified: false
    unverifiedNote: BxAgents signs the person in with Google's documented OAuth flow (authorization code with PKCE, offline access) and calls Google's own MCP server with the token. Both are built from Google's documentation, but a real sign in with a Google account was not tried.
risk: high
riskNote: Can send, reply to and forward email as the person, change labels and move messages to Trash or Spam.
docs: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
onDisconnect: purge
verifiedOn: 2026-11-27
