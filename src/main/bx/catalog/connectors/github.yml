id: github
name: GitHub
icon: git-branch
category: Developer
summary: Repositories, issues, pull requests, Actions and code search
transport: http
url: https://api.githubcopilot.com/mcp/
auth:
  - type: bearer
    envVar: GITHUB_PERSONAL_ACCESS_TOKEN
    help: A personal access token. Give it only the repositories and permissions the agent needs.
    verified: true
options:
  - key: toolsets
    label: Toolsets
    help: A comma separated list of the GitHub toolsets to enable, for example issues,pull_requests. Left empty, the server's default set is used.
    type: text
    target: header
    name: X-MCP-Toolsets
    default: ""
  - key: readonly
    label: Read only
    help: Turns off every tool that changes something.
    type: boolean
    target: header
    name: X-MCP-Readonly
    default: false
risk: high
riskNote: Can create pull requests, push files, merge, delete files and trigger Actions. Prefer a fine-grained token with read access first.
docs: https://github.com/github/github-mcp-server
verifiedOn: 2026-11-14
