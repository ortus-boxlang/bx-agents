id: asana
name: Asana
icon: check-square
category: Productivity
summary: Search, read, create and update tasks, projects and comments in Asana
transport: http
url: https://mcp.asana.com/v2/mcp
auth:
  - type: oauth
    app: own
    scopes: [ default ]
    envVars:
      clientId: ASANA_CLIENT_ID
      clientSecret: ASANA_CLIENT_SECRET
    help: In the Asana developer console create a new app of type MCP app, add the redirect address (the public address of this app followed by /__bxagents/connect/callback) on its OAuth page, and under Manage distribution allow the workspaces that will use it. Asana does not accept dynamic client registration.
    verified: true
risk: medium
riskNote: Can create and change tasks, projects and comments in the workspaces the person can reach.
docs: https://developers.asana.com/docs/integrating-with-asanas-mcp-server
verifiedOn: 2026-11-27
