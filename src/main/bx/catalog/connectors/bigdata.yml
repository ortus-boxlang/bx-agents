id: bigdata
name: Bigdata.com
icon: chart-line
category: Finance
summary: Search financial news, filings, earnings transcripts and analyst research
transport: http
url: https://mcp.bigdata.com/
auth:
  - type: bearer
    envVar: BIGDATA_API_KEY
    header: x-api-key
    prefix: ""
