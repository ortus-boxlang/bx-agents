id: mixpanel
name: Mixpanel
icon: chart-line
category: Analytics
summary: Run reports on events, funnels and retention, and browse dashboards
transport: http
url: https://{region}/mcp
options:
  - key: region
    label: Mixpanel data region
    help: The region where your Mixpanel project stores its data.
    type: text
    target: host
    choices:
      - { value: mcp.mixpanel.com, label: US }
      - { value: mcp-eu.mixpanel.com, label: EU }
      - { value: mcp-in.mixpanel.com, label: India }
    default: mcp.mixpanel.com
auth:
  - type: oauth
    verified: true
risk: medium
riskNote: Reads analytics data, and can also create, edit and delete dashboards, tags and event definitions in the person's project. The admin picks the region that matches the project.
docs: https://docs.mixpanel.com/docs/mcp
verifiedOn: 2026-11-27
