id: hubspot
name: HubSpot
icon: users
category: Sales
summary: Search and update CRM records, activities, content and campaigns in HubSpot
transport: http
url: https://mcp.hubspot.com
auth:
  - type: oauth
    app: own
    envVars:
      clientId: HUBSPOT_CLIENT_ID
      clientSecret: HUBSPOT_CLIENT_SECRET
    help: In HubSpot go to Development, then MCP Connectors, and create an MCP connector with the redirect address (the public address of this app followed by /__bxagents/connect/callback). Copy its client id and client secret. The account must be on the HubSpot developer platform, and an admin connects first. Scopes come from what the person grants at install.
    verified: true
risk: high
riskNote: Can create and change CRM records, publish landing pages and blog posts, and create or schedule social posts. Use read access only to start with.
docs: https://developers.hubspot.com/docs/apps/developer-platform/build-apps/integrate-with-the-remote-hubspot-mcp-server
verifiedOn: 2026-11-27
