<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; __TITLE__</title>
<style>
	:root {
		color-scheme: light dark;
		--bg: #f6f7f9; --fg: #16181d; --card: #ffffff;
		--line: #d8dbe2; --accent: #2f6fed; --accent-fg: #ffffff;
		--err-bg: #fdecec; --err-fg: #8a1c1c;
	}
	@media ( prefers-color-scheme: dark ) {
		:root {
			--bg: #16181d; --fg: #e8eaf0; --card: #1e2128;
			--line: #333845; --err-bg: #3a1d1d; --err-fg: #ffb4b4;
		}
	}
	* { box-sizing: border-box }
	body {
		margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
		background: var( --bg ); color: var( --fg );
		font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	form {
		background: var( --card ); border: 1px solid var( --line );
		border-radius: 12px; padding: 2rem; width: min( 22rem, 100% );
	}
	h1 { margin: 0 0 1.5rem; font-size: 1.25rem }
	label { display: block; margin: 0 0 .35rem; font-size: .875rem }
	input {
		width: 100%; padding: .6rem; margin: 0 0 1.25rem;
		border: 1px solid var( --line ); border-radius: 6px;
		background: var( --bg ); color: var( --fg ); font: inherit;
	}
	button {
		width: 100%; padding: .7rem; border: 0; border-radius: 6px;
		background: var( --accent ); color: var( --accent-fg );
		font: inherit; font-weight: 600; cursor: pointer;
	}
	button:hover { filter: brightness( 1.08 ) }
	.err {
		margin: 0 0 1.25rem; padding: .65rem .75rem; border-radius: 6px;
		background: var( --err-bg ); color: var( --err-fg ); font-size: .875rem;
	}
	@media ( prefers-reduced-motion: reduce ) { * { transition: none !important } }
</style>
</head>
<body>
	<form method="post" action="__LOGIN_ACTION__">
		<h1>__TITLE__</h1>

		<!--
			Fixed text, shown purely on the presence of a query flag. Nothing the
			caller sent is ever echoed here, so the sign-in page cannot become the
			way to inject markup into itself.
		-->
		<p class="err" role="alert" id="err" hidden>Incorrect username or password.</p>

		<label for="username">Username</label>
		<input id="username" name="username" autocomplete="username" autofocus required>

		<label for="password">Password</label>
		<input id="password" name="password" type="password" autocomplete="current-password" required>

		<button type="submit">Sign in</button>
	</form>

	<script>
		if ( new URLSearchParams( window.location.search ).has( "failed" ) ) {
			document.getElementById( "err" ).hidden = false;
		}
	</script>
</body>
</html>
