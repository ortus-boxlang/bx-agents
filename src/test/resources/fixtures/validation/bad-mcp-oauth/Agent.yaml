name: bad-mcp-oauth-agent
model: openai/gpt-5
mcpServers:
  - url: https://nameless.example.com/mcp
    oauth: true
  - name: both
    url: https://both.example.com/mcp
    token: ${env.SOME_TOKEN}
    oauth: true
  - name: bad-keys
    url: https://keys.example.com/mcp
    oauth:
      scope: mail
      scopes: mail.read
      clientSecret: written-in-the-file
      redirectUri: ftp://nope
  - name: not-a-map
    url: https://map.example.com/mcp
    oauth: [ a ]
