name: with-mcp-oauth-agent
model: openai/gpt-5
mcpServers:
  - name: mail
    url: https://mail.example.com/mcp
    oauth:
      scopes: [ mail.read ]
      clientId: ${vault.MAIL_CLIENT_ID}
      clientSecret: ${vault.MAIL_CLIENT_SECRET}
  - name: calendar
    url: https://calendar.example.com/mcp
    oauth: true
