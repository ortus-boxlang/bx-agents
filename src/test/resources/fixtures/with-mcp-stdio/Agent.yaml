name: with-mcp-stdio-agent
model: openai/gpt-5
mcpServers:
  - name: git
    command: [uvx, mcp-server-git]
    prefix: git
    toolFilter: [git_status, git_diff]
    timeout: 60000
  - name: browser
    command: [bxplaywright, mcp]
    env:
      PLAYWRIGHT_API_KEY: ${env.PLAYWRIGHT_API_KEY}
      MODE: headless
    cwd: .
    inheritEnv: false
    maxRestarts: 1
  - name: github
    url: https://api.githubcopilot.com/mcp/
    token: ${env.GITHUB_PERSONAL_ACCESS_TOKEN}
    allowedHosts: [api.githubcopilot.com, "*.github.com"]
    redirects: false
    maxResponseBytes: 200000
    handshake: true
