intro-to-bxagents:
  title: "Introduction to BxAgents"
  description: >-
    A 29-lesson, hands-on course on BxAgents, the conventions-based framework for building
    AI agents on BoxLang. You build one support agent from a model that needs no key to a
    packaged, tested agent with a web app, routines, people and secrets.
  lessons:
    - course/01-welcome.md
    - course/02-what-is-bxagents.md
    - course/03-installing-bxagents.md
    - course/practice-model.md
    - course/04-scaffolding-your-first-agent.md
    - course/05-agent-bx.md
    - course/06-instructions-and-system-prompt.md
    - course/07-building-your-agent.md
    - course/08-talking-to-your-agent.md
    - course/09-giving-your-agent-tools.md
    - course/10-packaging-skills.md
    - course/12-named-model-configs.md
    - course/15-the-generated-web-chat-ui.md
    - course/approvals.md
    - course/memory-and-notes.md
    - course/11-composing-subagents.md
    - course/routines-and-reports.md
    - course/16-scheduling-background-work.md
    - course/13-exposing-http-and-mcp.md
    - course/14-connecting-chat-platforms.md
    - course/17-hosting-mcp-servers.md
    - course/users-roles-and-tokens.md
    - course/the-vault.md
    - course/layered-settings.md
    - course/operating-it.md
    - course/18-interceptors-and-modules.md
    - course/19-testing-your-agent.md
    - course/20-packaging-deploying-and-wrapping-up.md
    - course/capstone.md
