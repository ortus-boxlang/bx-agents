// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:java_packaging
plugins {
    id 'java'
    // For source code formatting
    id "com.diffplug.spotless" version "8.10.2"
	// https://github.com/harbby/gradle-serviceloader
    id "com.github.harbby.gradle.serviceloader" version "1.1.9"
	// Shadow
	id "com.gradleup.shadow" version "9.6.1"
    // Download task
    id "de.undercouch.download" version "5.7.0"
}

/**
 * Project Properties
 */
ext {
	buildID = System.getenv( 'BUILD_ID' ) ?: '0'
	branch = System.getenv( 'BRANCH' ) ?: 'development'

	// Supporting BoxLang modules the test/dev harness needs installed locally
	// (fetched by `downloadModules`, same way `downloadBoxLang` fetches BoxLang
	// core itself). Add a module by appending { name, moduleName, version } -
	// `name` is the ForgeBox/download slug, `moduleName` is the folder name
	// BoxLang's own module service uses as the module's identity (its box.json's
	// `boxlang.moduleName`), which is often different from the slug.
	boxlangModules = [
		// Every BoxLang module BX Agents needs is BUNDLED inside the published
		// module zip, as a nested module (BoxLang 1.17+ loads anything under a
		// module's own `modules/` folder, to any depth), so `install-bx-module
		// bx-agents` is the only install a user ever does. A version of
		// "latest" resolves to ForgeBox's newest stable release at build time.
		//
		// The versions live in gradle.properties (bxAiVersion, ...).
		//
		// bx-ai: runtime for every agent (aiModel()/aiAgent()/toAi() routing,
		// GatewaySession, gateways, the "mock" provider the suite relies on).
		[ name: "bx-ai", moduleName: "bxai", version: bxAiVersion ],
		// bx-ftp: the ftp/sftp deploy targets call the real bx:ftp component.
		[ name: "bx-ftp", moduleName: "ftp", version: bxFtpVersion ],
		// bx-sqlite: the web UI's SQLite store; supplies the JDBC driver that
		// makes `this.datasources[...] = { driver: "sqlite" }` resolvable.
		[ name: "bx-sqlite", moduleName: "sqlite", version: bxSqliteVersion ],
		// bx-mail: the email gateway.
		[ name: "bx-mail", moduleName: "mail", version: bxMailVersion ],
		// bx-yaml: reads Agent.yaml, the default way to define an agent.
		[ name: "bx-yaml", moduleName: "yaml", version: bxYamlVersion ]
	]
}

if ( branch == 'development' ) {
    // If the branch is 'development', ensure the version ends with '-snapshot'
    // This replaces any existing prerelease identifier with '-snapshot'
    version = version.contains( '-' ) ? version.replaceAll( /-.*/, '-snapshot' ) : "${version}-snapshot"
	boxlangVersion = boxlangVersion.contains( '-' ) ? boxlangVersion.replaceAll( /-.*/, '-snapshot' ) : "${boxlangVersion}-snapshot"
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
	// Look for it in the local build directory
	// You must run `./gradle build -x test` in the BoxLang project
	if ( file( '../boxlang/build/libs/boxlang-' + boxlangVersion + '.jar' ).exists() ) {
		compileOnly files( '../boxlang/build/libs/boxlang-' + boxlangVersion + '.jar' )
		testImplementation files( '../boxlang/build/libs/boxlang-' + boxlangVersion + '.jar' )
	} else {
		// Downloaded Dependencies from s3
		compileOnly files( 'src/test/resources/libs/boxlang-' + boxlangVersion + '.jar' )
		testImplementation files( 'src/test/resources/libs/boxlang-' + boxlangVersion + '.jar' )
	}

	// Implementation Dependencies FOR THIS MODULE

	// Pure-Java git implementation for `new --repo` (clones without requiring
	// a `git` binary on PATH - see RepoCloner.bx). Bundled into the module's
	// own shadowJar like every other runtime dependency here.
	implementation 'org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r'

	// Terminal UI for the `new` wizard (and `chat`). TamboUI draws, JLine 3 is
	// its terminal backend. Bundled in the shadowJar; BoxLang itself ships no
	// JLine, so nothing here clashes with the runtime. Pinned because TamboUI
	// says its API is still moving - everything uses it through
	// ortus.boxlang.bxagents.tui, so a bump touches that package only.
	implementation platform( 'dev.tamboui:tamboui-bom:0.6.0' )
	implementation 'dev.tamboui:tamboui-core'
	implementation 'dev.tamboui:tamboui-widgets'
	implementation 'dev.tamboui:tamboui-tui'
	implementation 'dev.tamboui:tamboui-jline3-backend'

	// Test Frameworks
	testImplementation 'io.github.cdimascio:dotenv-java:3.2.0'
	testImplementation "org.junit.jupiter:junit-jupiter:6.+"
	testImplementation "org.mockito:mockito-core:5.+"
	testImplementation "com.google.truth:truth:1.+"
	// Explicitly declare the JUnit platform launcher (to avoid deprecation)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
	toolchain {
        languageVersion.set( JavaLanguageVersion.of( jdkVersion ) )
    }
	withJavadocJar()
	withSourcesJar()
}

// Exclude main resources from IDE classpath to avoid class loading conflicts
// Resources are still included in the JAR/build outputs
sourceSets {
	main {
		resources {
			// Empty the resources to exclude from IDE classpath
			srcDirs = []
		}
	}
}

compileJava {
	// Compiler Options
	options.incremental = true
	options.encoding = 'UTF-8'
	options.debugOptions.debugLevel = "source,lines,vars"
}

compileTestJava{
	// Make sure the service loaders are created before testing
	dependsOn compileJava, serviceLoaderBuild
}
compileTestJava.finalizedBy( shadowJar )

/**
 * Clean up
 */
clean {
	doLast{
		var userDir = file( "${System.getProperty('user.home')}/.boxlang/classes" )
		if ( userDir.exists() ) {
			userDir.deleteDir()
			println "+ Cleared user home classes " + userDir.toString()
		}
		println "+ Clean finalized!"
	}
}

javadoc {
    // To avoid our own doclet issues
	options.addBooleanOption( "Xdoclint:none", true )
	//exclude '**/boxlang/parser/**'
	options.addBooleanOption( 'html5', true )
}
task zipJavadocs( type: Zip ) {
	group = "documentation"
	from javadoc.destinationDir
	archiveFileName = "${project.name}-javadocs-${version}.zip"
	destinationDirectory = file( "$buildDir/distributions" )
	// Output that the docs have been zippped
	doLast {
		println "+ Javadocs have been zipped to the distribution folder"
	}
}
javadoc.finalizedBy( zipJavadocs )

/**
 * Docs are here:
 * - https://github.com/harbby/gradle-serviceloader,
 * - https://plugins.gradle.org/plugin/com.github.harbby.gradle.serviceloader
 * This generates the META-INF/services files for the ServiceLoader as part of the `build` task
 */
serviceLoader {
	serviceInterface 'ortus.boxlang.runtime.jdbc.drivers.IJDBCDriver'
    serviceInterface 'ortus.boxlang.runtime.bifs.BIF'
    serviceInterface 'ortus.boxlang.runtime.components.Component'
    serviceInterface 'ortus.boxlang.runtime.async.tasks.IScheduler'
    serviceInterface 'ortus.boxlang.runtime.cache.providers.ICacheProvider'
	serviceInterface 'ortus.boxlang.runtime.events.IInterceptor'
	serviceInterface 'ortus.boxlang.runtime.services.IService'
}

jar {
    archiveVersion =  "${version}"
 	manifest {
	   attributes 'Description': 'BX Agents'
    }
}
shadowJar {
	archiveClassifier = ''
    mergeServiceFiles()
    destinationDirectory = file( "build/libs" )
}

/**
 * Source Code Formatting
 */
spotless {
    java {
		target fileTree( "." ) {
            include "**/*.java"
            exclude "**/build/**", "bin/**", "examples/**"
        }
        eclipse().configFile( "./.ortus-java-style.xml" )
		toggleOffOn()
    }
}

/**
 * ColdBox runtime libraries (coldbox, qb, cbsecurity, cbauth, cbmailservices)
 * Installed with CommandBox (the bx-cli / `commandbox-boxlang` tooling every
 * developer has installed) from src/main/lib/box.json into build/lib-stage -
 * `coldbox` to lib/coldbox, every module to lib/modules, via the same
 * `installPathConventions` the ColdBox application templates use - then bundled into the module as `lib/` by
 * createModuleStructure. `bxAgents new`/`build` copy them into every generated
 * app, so users never install them. Needs `box` (CommandBox) on the PATH.
 */
task installLibs( type: Exec ) {
	group = "boxlang"
	description = "Installs the SHIPPED libraries (dependencies only, no devDependencies) from src/main/lib/box.json with CommandBox into build/lib-prod"
	// Skipped when the manifest is unchanged and the staged libs are still there
	inputs.file "src/main/lib/box.json"
	outputs.dir "build/lib-prod"
	doFirst {
		delete( "build/lib-prod" )
		copy {
			from "src/main/lib/box.json"
			into "build/lib-prod"
		}
	}
	workingDir "build/lib-prod"
	commandLine "box", "install", "--production"
}

/**
 * Same manifest, devDependencies included (TestBox and its own dependencies),
 * for the developer's machine and CI. Never shipped.
 */
task installDevLibs( type: Exec ) {
	group = "boxlang"
	description = "Installs every library incl. devDependencies (TestBox) from src/main/lib/box.json with CommandBox into build/lib-stage"
	inputs.file "src/main/lib/box.json"
	outputs.dir "build/lib-stage"
	doFirst {
		delete( "build/lib-stage" )
		copy {
			from "src/main/lib/box.json"
			into "build/lib-stage"
		}
	}
	workingDir "build/lib-stage"
	commandLine "box", "install"
}

/**
 * Custom task that creates a build/modules/bxagents folder - a real,
 * installable module structure.
 * - Copies the build/libs/bx-agents-{version}.jar to build/modules/bxagents/libs/
 * - Copies the src/main/bx/** to build/modules/bxagents/ folder.
 *
 * Lives at build/modules/bxagents (NOT build/module) so its own folder name
 * matches the module's registered name ("bxagents", per box.json's
 * boxlang.moduleName / ModuleConfig.bx's this.mapping) - required for
 * BoxLang's ModuleService to discover it via a `modulesDirectory` setting
 * (confirmed empirically: ModuleService keys a module's identity off the
 * folder name under modulesDirectory, not off any value inside box.json).
 * boxlang.json's own modulesDirectory points at build/modules for exactly
 * this reason - see the ModuleConfig.bx / BuildPipeline.bx module-path fix
 * this same session, which found every CLI verb failed under a genuinely
 * installed module because internal references only worked against the
 * OLD build/module folder's ad hoc (non-discoverable) shape.
 */
task createModuleStructure(type: Copy) {
	mustRunAfter shadowJar, jar
	// The bundled BoxLang modules and ColdBox libs must be in place BEFORE this copies
	// and the zip is built, or a fresh build ships a zip without them
	dependsOn "downloadModules", "installLibs"
    from( 'build/libs' ) {
		include "${project.name}-${version}.jar"
        into 'libs'
    }
    from( 'src/main/bx' ) {
		include '**/*.bx'
		include '**/*.bxm'
		include '**/*.bxs'
		include '**/*.html'
		// Token Replacements Go Here
		filter{ line -> line.replaceAll( '@build.version@', project.version ) }
		if( project.branch == "development" ){
			filter{ line -> line.replaceAll( '\\+@build.number@', '' ) }
		} else {
			filter{ line -> line.replaceAll( '@build.number@', project.buildID ) }
		}
    }
    from( '.' ) {
        include 'box.json'
		include 'readme.md'
		include 'changelog.md'
		// Token Replacements Go Here
		filter{ line -> line.replaceAll( '@build.version@', project.version ) }
		if( project.branch == "development" ){
			filter{ line -> line.replaceAll( '\\+@build.number@', '' ) }
		} else {
			filter{ line -> line.replaceAll( '@build.number@', project.buildID ) }
		}
    }
    // Shell tab completion, installed by install-bx-module from boxlang.completions in box.json.
    // tools/ (the generator) is not copied: only the folders listed here ship.
    from( 'completions' ) {
        into 'completions'
    }
    // Bundled BoxLang modules (see downloadModules), loaded as nested modules
    from( 'build/bundle-modules' ) {
		into 'modules'
	}
    // Bundled ColdBox runtime libs (see installLibs) - copied into every generated app
    // (installLibs stages them as build/lib-prod/lib/{coldbox,modules/*} - the layout of lib/ itself;
    // devDependencies such as TestBox are only in build/lib-stage and never ship)
    from( 'build/lib-prod/lib' ) {
		into 'lib'
	}
    destinationDir = file( 'build/modules/bxagents' )
}
task zipModuleStructure( type: Zip ) {
    group = "distribution"
    from createModuleStructure.destinationDir
    archiveFileName = "${project.name}-${version}.zip"
    destinationDirectory = file( "$buildDir/distributions" )
    // Output that the module has been zippped
    doLast {
        println "+ Module has been zipped to the distribution folder"
    }
}
createModuleStructure.finalizedBy( zipModuleStructure )
shadowJar.finalizedBy( createModuleStructure )

/**
 * Template Token Guard
 * Fails the build if any leftover `@MODULE_*@` template placeholder tokens remain
 * (i.e. the boxlang-module-template setup was never completed/finished).
 */
task checkTemplateTokens {
	group = "verification"
	description = "Fails if any @MODULE_*@ template placeholder tokens remain in the repo"
	doLast {
		def offenders = []
		def textExtensions = [ "bx", "bxs", "bxm", "java", "json", "md", "gradle", "properties", "yml", "yaml", "xml", "txt" ]
		fileTree( dir: projectDir, excludes: [ "**/.git/**", "**/build/**", "**/node_modules/**", "**/testbox/**", "**/src/test/resources/libs/**" ] ).each { f ->
			if ( f.isFile() && f.name != "build.gradle" && textExtensions.contains( f.name.tokenize( '.' ).last().toLowerCase() ) ) {
				try {
					if ( f.text =~ /@MODULE_[A-Z_]+@/ ) {
						offenders << f
					}
				} catch ( ignored ) {
					// Skip unreadable/binary files
				}
			}
		}
		if ( !offenders.isEmpty() ) {
			throw new GradleException( "Leftover @MODULE_*@ template tokens found in: " + offenders.join( ", " ) )
		}
		println "+ No leftover @MODULE_*@ template tokens found"
	}
}
check.dependsOn checkTemplateTokens

/**
 * TestBox BDD Suite
 * Runs the BoxLang/TestBox spec suite under `tests/specs` via `runTests.bxs`,
 * a small custom CLI runner (see that file's docblock for why: TestBox's own
 * testbox/system/runners/BoxLangRunner.bx has an Application.bx-mapping
 * auto-discovery bug that breaks bundle discovery in this project's layout).
 *
 * Requires:
 *  - `downloadBoxLang` to have fetched the BoxLang jar (compileJava/test already depend on it via classpath)
 *  - `testbox/` present at the project root (fetch via `box install` locally, or let CI's
 *    Setup CommandBox CLI + `box install` step provide it)
 */
task testBx( type: JavaExec ) {
	group = "verification"
	description = "Runs the TestBox BDD test suite (tests/specs) via runTests.bxs"
	dependsOn compileJava, installDevLibs
	onlyIf {
		if ( !file( "build/lib-stage/lib/testbox" ).exists() ) {
			println "! Skipping testBx: build/lib-stage/lib/testbox not found - run `./gradlew installDevLibs` first"
			return false
		}
		return true
	}
	classpath = files( "build/classes/java/main" ) + fileTree( dir: 'src/test/resources/libs', include: '*.jar' )
	mainClass = 'ortus.boxlang.runtime.BoxRunner'
	args = [ '--bx-config', 'boxlang.json', 'runTests.bxs' ]
	workingDir = projectDir
}

/**
 * ColdBox Integration Suite
 * Runs the ColdBox-dependent specs (tests/specs/integration/coldbox/**) via
 * runColdBoxIntegrationTests.bxs, which boots a real boxlang-miniserver and
 * hits tests/runner-coldbox.bxm over real HTTP - a genuine ColdBox boot
 * needs a real `cgi` scope, which CLI mode (the plain `testBx` task) never
 * has, confirmed this session. Kept as its own task/CI step rather than
 * folded into `testBx` for that reason.
 *
 * Requires:
 *  - `downloadMiniServer` to have fetched the boxlang-miniserver jar
 *  - `tests/coldbox` present (fetch via `box install` in tests/, or let CI's
 *    "Install ColdBox" step provide it)
 */
task testColdBoxIntegration( type: JavaExec ) {
	// boxlang.json maps /coldbox and /testbox into build/lib-stage
	dependsOn installDevLibs
	group = "verification"
	description = "Runs the ColdBox-dependent integration specs (tests/specs/integration/coldbox) over real HTTP via boxlang-miniserver"
	// shadowJar, not just compileJava, for the same reason verifyExamples
	// needs it: boxlang.json resolves bxModules.bxagents.* against
	// build/modules/bxagents, a Copy of src/main/bx that ONLY refreshes when
	// shadowJar runs. Depending on compileJava alone silently built these
	// fixtures with a STALE generator - confirmed the hard way this session,
	// when a corrected route-condition closure kept generating in its old,
	// broken form and the app 500'd.
	dependsOn compileJava, shadowJar
	onlyIf {
		if ( !file( "build/lib-stage/lib/coldbox" ).exists() ) {
			println "! Skipping testColdBoxIntegration: build/lib-stage/lib/coldbox not found - run `./gradlew installDevLibs` first"
			return false
		}
		if ( fileTree( dir: 'src/test/resources/libs', include: 'boxlang-miniserver-*.jar' ).isEmpty() ) {
			println "! Skipping testColdBoxIntegration: boxlang-miniserver jar not found - run `./gradlew downloadMiniServer` first"
			return false
		}
		return true
	}
	classpath = files( "build/classes/java/main" ) + fileTree( dir: 'src/test/resources/libs', include: '*.jar' )
	mainClass = 'ortus.boxlang.runtime.BoxRunner'
	args = [ '--bx-config', 'boxlang.json', 'runColdBoxIntegrationTests.bxs' ]
	workingDir = projectDir
	// The agentApi token-gate check needs this in the ENVIRONMENT, not as a
	// -D system property: it is read by the miniserver the script spawns as a
	// child process, which inherits this JVM's environment but not its system
	// properties. A fixed value is fine - it gates a throwaway localhost app
	// built fresh on every run, and is never written to any generated source
	// (only the variable NAME is). Without it the script skips that check and
	// says so rather than passing vacuously.
	environment "BXAGENTS_E2E_TOKEN", "bxagents-integration-token"
}

/**
 * Examples Regression Gate
 * Builds every project under examples/ through the real BuildPipeline via
 * verifyExamples.bxs - a cheap "the whole feature matrix still builds"
 * regression net, and a docs-drift guard (each example demonstrates a real
 * convention documented under docs/conventions/).
 *
 * Requires only `downloadBoxLang` (no ColdBox/miniserver needed - this never
 * boots an app, just runs the build pipeline).
 */
task verifyExamples( type: JavaExec ) {
	group = "verification"
	description = "Builds every project under examples/ via the real BuildPipeline"
	// boxlang.json's modulesDirectory resolves bxModules.bxagents.* against
	// build/modules/bxagents (a Copy of src/main/bx, only refreshed when
	// shadowJar runs - see shadowJar.finalizedBy(createModuleStructure)
	// above), NOT directly against src/main/bx. Depending on compileJava
	// alone let this task silently verify a STALE copy of the gateway
	// classes/validator against a source tree that had already moved on -
	// confirmed by hand this session after adding new gateway types.
	dependsOn compileJava, shadowJar
	classpath = files( "build/classes/java/main" ) + fileTree( dir: 'src/test/resources/libs', include: '*.jar' )
	mainClass = 'ortus.boxlang.runtime.BoxRunner'
	args = [ '--bx-config', 'boxlang.json', 'verifyExamples.bxs' ]
	workingDir = projectDir
}

test {
    useJUnitPlatform()
    // ModuleCliProcessTest copies TestBox out of the dev install
    dependsOn installDevLibs
    testLogging {
		showStandardStreams = true
		events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
	}
	classpath = classpath.filter { !it.path.contains( "build${File.separator}resources" ) }
}

/**
 * TEMPORARY until we publish to maven
 * Task to download the latest jar from https://ortus-temp.s3.amazonaws.com/jericho/libs/boxlang-1.0.0.jar
 */
task downloadBoxLang( type: Download ) {
	// Create the destination directory
	doFirst {
		file( "src/test/resources/libs" ).mkdirs()
	}
    // Configure the URL of the file to download
    src "https://downloads.ortussolutions.com/ortussolutions/boxlang/${boxlangVersion}/boxlang-${boxlangVersion}.jar"
    // Specify the destination directory for the downloaded file
    dest "src/test/resources/libs/boxlang-${boxlangVersion}.jar"
    overwrite true
    onlyIfModified false
}

/**
 * boxlang-miniserver (a separate standalone runtime the `serve` CLI verb
 * shells out to - see MiniServerLauncher.java) ships as a plain executable
 * jar at a predictable, non-forgebox URL (same distribution pattern as
 * BoxLang core itself). Downloading it here means integration tests can
 * actually boot a real MiniServer (`java -jar boxlang-miniserver-*.jar
 * config.json`) instead of skipping whenever the binary isn't on PATH.
 */
task downloadMiniServer( type: Download ) {
	group = "boxlang"
	description = "Downloads the boxlang-miniserver jar for integration testing"
	doFirst {
		file( "src/test/resources/libs" ).mkdirs()
	}
	src "https://s3.amazonaws.com/downloads.ortussolutions.com/ortussolutions/boxlang-runtimes/boxlang-miniserver/${boxlangMiniServerVersion}/boxlang-miniserver-${boxlangMiniServerVersion}.jar"
	dest "src/test/resources/libs/boxlang-miniserver-${boxlangMiniServerVersion}.jar"
	overwrite true
	onlyIfModified false
}

/**
 * Bundled BoxLang Modules
 * Downloads + unpacks every module declared in `ext.boxlangModules` (bx-ai,
 * etc.) from ForgeBox's stable download URL pattern, into
 * `build/bundle-modules/{moduleName}/`, which `createModuleStructure` copies into
 * the module as its nested `modules/` folder - so the very same files are what
 * the test harness loads and what the published zip ships.
 * `version: "latest"` is resolved against ForgeBox's API at run time.
 */
def resolveModuleVersion = { String slug, String requested ->
	if ( requested != "latest" ) {
		return requested
	}
	def json = new groovy.json.JsonSlurper().parse( new URL( "https://www.forgebox.io/api/v1/entry/${slug}/latest" ) )
	if ( json.error || !json.data?.version ) {
		throw new GradleException( "Could not resolve the latest stable version of [${slug}] from ForgeBox: ${json.messages}" )
	}
	// ForgeBox reports "3.5.0+19"; the download URL carries only the semver part
	return json.data.version.toString().split( '\\+' )[ 0 ]
}

task downloadModules {
	group = "boxlang"
	description = "Downloads and unpacks the BoxLang modules bundled into BX Agents (bx-ai, etc.) declared in ext.boxlangModules"
	def modulesDir = file( "build/bundle-modules" )
	// Declared, so it re-runs when a version changes and is skipped otherwise; createModuleStructure
	// copies it into the module as modules/ (it must NOT write into the module folder itself:
	// that folder is createModuleStructure's output and it wipes what it did not copy)
	inputs.property( "modules", boxlangModules.collect { it.name + "@" + it.version }.join( "," ) )
	outputs.dir modulesDir
	doLast {
		modulesDir.mkdirs()
		def cacheDir = file( "build/module-downloads" )
		cacheDir.mkdirs()
		boxlangModules.each { mod ->
			def version = resolveModuleVersion( mod.name, mod.version )
			def zipFile = new File( cacheDir, "${mod.name}-${version}.zip" )
			if ( !zipFile.exists() ) {
				def url = "https://downloads.ortussolutions.com/ortussolutions/boxlang-modules/${mod.name}/${version}/${mod.name}-${version}.zip"
				// Download to a temp file and rename, so a failed or interrupted download never
				// leaves a truncated zip that the exists() check above would trust next time
				def partFile = new File( cacheDir, zipFile.name + ".part" )
				try {
					partFile.withOutputStream { out -> new URL( url ).withInputStream { input -> out << input } }
					if ( !partFile.renameTo( zipFile ) ) {
						throw new GradleException( "Could not move ${partFile} to ${zipFile}" )
					}
				} finally {
					partFile.delete()
				}
			}
			def destDir = new File( modulesDir, mod.moduleName )
			if ( destDir.exists() ) {
				destDir.deleteDir()
			}
			copy {
				from zipTree( zipFile )
				into destDir
			}
			println "+ Bundled module [${mod.name}@${version}] into ${destDir}"
		}
	}
}

/**
 * Project Wide Helper function
 * This is not a task, but a reusable UDF
 */
project.ext.bumpVersion = { boolean major = false, boolean minor = false, boolean patch = false ->

	def propertiesFile = file( './gradle.properties' );
	def properties = new Properties();

	properties.load( propertiesFile.newDataInputStream() )
	def versionTarget = major ? 0 : minor ? 1 : 2

	def currentVersion = properties.getProperty( 'version' )
	def versionParts = currentVersion.split( '\\.' )
	def newPathVersion = versionParts[ versionTarget ].toInteger() + 1
	def newVersion = '';

	if( patch ){
		newVersion = "${versionParts[ 0 ]}.${versionParts[ 1 ]}.${newPathVersion}"
	} else if( minor ){
		newVersion = "${versionParts[ 0 ]}.${newPathVersion}.0"
	} else if( major ){
		newVersion = "${newPathVersion}.0.0"
	}

	properties.setProperty( 'version', newVersion )
	properties.store( propertiesFile.newWriter(), null )

	println "Bumped version from ${currentVersion} to ${newVersion}"
}
/**
 * Bump the major version number
 */
task bumpMajorVersion {
	doLast{
		bumpVersion( true )
	}
}

/**
 * Bump the minor version number
 */
task bumpMinorVersion {
	doLast{
		bumpVersion( false, true )
	}
}

/**
 * Bump the patch version number
 */
task bumpPatchVersion {
	doLast{
		bumpVersion( false, false, true )
	}
}
