name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
  pull_request:
    branches:
      - "releases/v*"
      - development

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Validate the workflow files themselves. A malformed workflow does not fail
  # loudly: GitHub records a zero-duration run with no jobs and a bare "failure"
  # conclusion, and if the file's own trigger does not match the branch it is not
  # a PR check either - so it is easy to miss entirely. A duplicated `on:` key
  # silently disabled Publish Docs this way, and `yaml.safe_load` did not catch
  # it because duplicate keys are legal YAML (last one wins) but illegal here.
  workflow_lint:
    name: Lints GitHub Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  # Format PR
  format_check:
    name: Checks Source Code Formatting
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: 21

      # The cfformat step that used to sit here ran `run-script format:check`,
      # but this repo's box.json defines no such script and carries no
      # .cfformat.json, so it failed on every run rather than checking anything.
      # Removed rather than left failing; spotless below is the gate that
      # actually works. Add cfformat back alongside a real config + script if
      # BoxLang-source formatting should be enforced too.
      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck
