name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
  pull_request:
    branches:
      - "releases/v*"
      - development

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Format PR
  format_check:
    name: Checks Source Code Formatting
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: 21

      # The cfformat step that used to sit here ran `run-script format:check`,
      # but this repo's box.json defines no such script and carries no
      # .cfformat.json, so it failed on every run rather than checking anything.
      # Removed rather than left failing; spotless below is the gate that
      # actually works. Add cfformat back alongside a real config + script if
      # BoxLang-source formatting should be enforced too.
      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck
