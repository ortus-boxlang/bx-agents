name: Publish Docs

# Builds docs/ with bx-sites (https://ortus-boxlang.github.io/bx-sites/development/ -
# there's no bx-sites `main` branch published yet, so its own docs currently
# only live under /development/) and
# publishes it to GitHub Pages at https://ortus-boxlang.github.io/bx-agents/.
#
# This follows bx-sites' own documented deployment approach - see
# https://ortus-boxlang.github.io/bx-sites/development/guides/deployment/ and
# the reference workflow it ships (.github/workflows/pages.yml): build the
# site, then push site/ to a `gh-pages` branch with peaceiris/actions-gh-pages.
#
# LAYOUT - one version per folder:
#   development -> /development/   (latest, what this repo develops against)
#   main        -> /               (the released docs)
# Because each branch deploys with `keep_files: true` into its OWN
# destination_dir, the two never overwrite each other, and a push only has to
# rebuild the branch it happened on. Until a `main` branch exists, development
# also drops a redirect at the root so the bare site URL is never a 404.
#
# ONE-TIME SETUP, which no workflow file can do for itself: the repository's
# Settings -> Pages -> Build and deployment -> Source must be
# "Deploy from a branch" -> gh-pages -> / (root). The first successful run
# below creates gh-pages, so set it after that run completes.
#
# Do NOT point that setting at `development` (or any source branch), and do
# NOT add a root .nojekyll to "fix" a failing Jekyll build. A branch source
# other than gh-pages makes GitHub run its built-in Jekyll pipeline over the
# whole repository root - which is not a Jekyll site - and a .nojekyll would
# only make that pipeline SUCCEED, publishing the raw repo over these docs.

on:
  push:
    branches:
      - main
      - development
    paths:
      - "docs/**"
      - "bxsites.yaml"
      - ".github/workflows/docs.yml"

  # So a republish never needs an empty commit
  workflow_dispatch:

# contents: write - actions-gh-pages commits the built site to gh-pages
permissions:
  contents: write

# Each branch publishes to its own destination_dir, so main and development
# deploys never conflict - only serialize a branch against its own prior runs.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang + bx-sites
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          with-commandbox: true
          # bx-sites renders through bx-markdown, encodes through bx-esapi,
          # reads bxsites.yaml through bx-yaml, and resizes images through
          # bx-image - all four are hard dependencies of the module, not
          # optional extras.
          modules: bx-sites,bx-markdown,bx-esapi,bx-yaml,bx-image

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Point baseURL and repo.editUri at this branch's own sub-path
        if: github.ref_name != 'main'
        run: |
          # main's committed bxsites.yaml already points baseURL/editUri at
          # the site root and the main branch - every other branch publishes
          # under /<branch-name>/ and edits against its own branch instead,
          # so patch this job's own checkout of the config just for this build.
          export URL="https://ortus-boxlang.github.io/bx-agents/${{ github.ref_name }}/"
          export EDIT_URI="edit/${{ github.ref_name }}/docs/"
          yq eval -i '.baseURL = strenv(URL) | .repo.editUri = strenv(EDIT_URI)' bxsites.yaml

      - name: Build the site
        run: boxlang bxSites build

      - name: Fail if the build produced nothing
        run: |
          # bxSites exits 0 having written an empty site if docs/ is empty or
          # misconfigured. A published-but-blank docs site is worse than a
          # failed build, so check for real output rather than trusting exit 0.
          test -f site/index.html \
            || { echo "::error::site/index.html missing - the docs build produced no site"; exit 1; }
          echo "Built $(find site -name '*.html' | wc -l) HTML page(s)"

      - name: Deploy main to the site root
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Deploy development to /development/
        if: github.ref_name == 'development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: development
          keep_files: true

      - name: Stage a root redirect while there is no main branch
        id: redirect
        if: github.ref_name == 'development'
        run: |
          # Once main exists it owns the root, and this step stops running -
          # keep_files means the redirect it leaves behind is simply
          # overwritten by main's own index.html on that branch's next deploy.
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "main exists - it owns the site root; no redirect needed"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p _root
          # Both a meta refresh and a JS hop, so it works with scripting
          # disabled; the visible link is the fallback if neither fires.
          cat > _root/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>BxAgents Documentation</title>
            <meta http-equiv="refresh" content="0; url=./development/">
            <link rel="canonical" href="./development/">
            <script>location.replace("./development/")</script>
          </head>
          <body>
            <p>Redirecting to the <a href="./development/">BxAgents documentation</a>.</p>
          </body>
          </html>
          HTML
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the root redirect
        if: github.ref_name == 'development' && steps.redirect.outputs.needed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_root
          keep_files: true
