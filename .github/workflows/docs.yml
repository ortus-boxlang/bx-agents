name: Publish Docs

# Builds docs/ with bx-docs (https://ortus-boxlang.github.io/bx-docs/) and
# publishes it to GitHub Pages at https://ortus-boxlang.github.io/bx-agents/.
#
# LAYOUT - one version per folder, matching bx-docs' own site:
#   development -> /development/   (latest, what this repo develops against)
#   main        -> /               (the released docs)
# Until a `main` branch exists, the root serves a redirect into /development/
# so the bare site URL is never a 404.
#
# Because GitHub's Pages deployment replaces the WHOLE site on every deploy,
# two branches cannot each own a sub-path by deploying separately - the second
# deploy would wipe the first. So ONE job assembles both versions into a single
# tree and deploys it once. That is why a push to either branch rebuilds both:
# it is what keeps them consistent, not redundant work.
#
# This uses GitHub's own Pages deployment rather than pushing a gh-pages branch.
#
# ONE-TIME SETUP, and `enablement` below does NOT cover it: the repository's
# Settings -> Pages -> Build and deployment -> Source must be set to
# "GitHub Actions" (not "Deploy from a branch"). configure-pages' own source
# (findOrCreatePagesSite) only calls createPagesSite - the call that sets
# build_type: workflow - when NO Pages site exists yet. If a site already
# exists on a branch source, it is returned as-is and its build_type is never
# changed, so the deploy below has nothing to publish to. `enablement: true` is
# still worth keeping: it covers a repository that has never had Pages at all.

on:
# `configure-pages` with `enablement: true` turns Pages ON for the repository
# via the API during the run. The gh-pages-branch approach cannot do that - it
# leaves Pages switched off until a human visits Settings -> Pages and points it
# at the branch, which is a manual step this workflow now avoids entirely.
#
# There is no `main` branch in this repository, so there is no released-vs-latest
# split to publish: development IS the site. If a `main` branch is ever added and
# needs its own /stable/ copy, note that Pages' own deployment replaces the whole
# site per deploy - two branches cannot each own a sub-path the way two pushes to
# gh-pages could. That would mean building both versions in ONE job and deploying
# the combined tree once.

on:
  push:
    branches:
      - main
      - development
    paths:
      - "docs/**"
      - "bxdocs.json"
      - ".github/workflows/docs.yml"

  # So a republish never needs an empty commit
  workflow_dispatch:

# contents: read  - checkout
# pages:    write - create the Pages site (enablement) and deploy to it
# id-token: write - deploy-pages authenticates via OIDC, not a PAT
permissions:
  contents: read
  pages: write
  id-token: write

# "pages" is the conventional group name for this: a repository has exactly one
# Pages site, so two concurrent deploys would race over the same target. Queue
# rather than cancel, so a superseded build still finishes cleanly.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Creates the Pages site if the repository has never had one. It does NOT
      # convert an existing branch-source site to an Actions-source one - see
      # the setup note at the top of this file.
      - name: Configure GitHub Pages (creating the site if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup BoxLang + bx-docs's dependencies
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          with-commandbox: true
          # bx-docs renders through bx-markdown and encodes through bx-esapi;
          # both are hard dependencies of the module, not optional extras.
          # bx-docs itself is installed by the NEXT step, not listed here: a
          # module that fails to install aborts this action outright, and the
          # next step needs to be able to fall back instead. Move bx-docs back
          # into this list once FORGEBOX serves its artifact.
          modules: bx-markdown,bx-esapi

      - name: Install bx-docs (FORGEBOX first, source checkout as fallback)
        run: |
          MODULES_DIR="${BOXLANG_HOME:-$GITHUB_WORKSPACE/.boxlang}/modules"
          mkdir -p "$MODULES_DIR"

          # Preferred path: the published module. This is a step of its own
          # rather than another entry in `modules:` above, because a failure
          # there aborts the whole job - and bx-docs currently DOES fail.
          if install-bx-module bx-docs && [ -f "$MODULES_DIR/bx-docs/ModuleConfig.bx" ]; then
            echo "Installed bx-docs from FORGEBOX"
            exit 0
          fi

          # Fallback, and why it exists: FORGEBOX has an entry for bx-docs but
          # no artifact behind it. Its own record points the installer at
          #   .../bx-docs/1.0.0-snapshot/bx-docs-1.0.0-snapshot.zip
          # (both boxJSON.location and downloadURL), and that URL 404s - as does
          # the 1.0.0-snapshot-snapshot path its doubled version string implies.
          # bx-markdown's equivalent URL returns 200, so this is specific to
          # bx-docs, not a downloads-host outage.
          #
          # bx-docs is pure BoxLang with ModuleConfig.bx at its repo root, so a
          # checkout IS a usable module. The moment the artifact is published,
          # the branch above wins on its own and this one stops running - no
          # edit needed here.
          echo "::warning::bx-docs could not be installed from FORGEBOX - falling back to a source checkout"
          rm -rf "$MODULES_DIR/bx-docs"
          git clone --depth 1 --branch development \
            https://github.com/ortus-boxlang/bx-docs.git "$MODULES_DIR/bx-docs"
          test -f "$MODULES_DIR/bx-docs/ModuleConfig.bx" \
            || { echo "::error::bx-docs checkout has no ModuleConfig.bx at its root"; exit 1; }
          echo "Installed bx-docs from source @ $(git -C "$MODULES_DIR/bx-docs" rev-parse --short HEAD)"

      - name: Build development into /development/
        run: |
          # Each version is served from its own sub-path, so its baseURL and
          # its "edit this page" links have to point at that sub-path and at
          # its own branch. Patch a throwaway copy of the config for the build.
          jq --arg url "https://ortus-boxlang.github.io/bx-agents/development/" \
             --arg editUri "edit/development/docs/" \
             '.baseURL = $url | .repo.editUri = $editUri' bxdocs.json > bxdocs.patched.json
          mv bxdocs.patched.json bxdocs.json

          boxlang module:bxdocs build

          # bxDocs always writes to site/; the sub-path layout is ours to make.
          mkdir -p _site
          mv site _site/development

      - name: Build main into the root, or leave a redirect if there is no main
        run: |
          # A push to EITHER branch rebuilds both versions, because the deploy
          # below replaces the whole site - see the note at the top of this file.
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git clone --depth 1 --branch main \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/main-docs"

            if [ -f "$RUNNER_TEMP/main-docs/bxdocs.json" ] && [ -d "$RUNNER_TEMP/main-docs/docs" ]; then
              cd "$RUNNER_TEMP/main-docs"
              jq --arg editUri "edit/main/docs/" \
                 '.repo.editUri = $editUri' bxdocs.json > bxdocs.patched.json
              mv bxdocs.patched.json bxdocs.json
              boxlang module:bxdocs build
              cp -R site/. "$GITHUB_WORKSPACE/_site/"
              echo "Built main into the site root"
              exit 0
            fi

            # main exists but predates the docs move - not an error, just
            # nothing to publish there yet.
            echo "main has no bxdocs.json/docs - falling back to the redirect"
          else
            echo "No main branch - falling back to the redirect"
          fi

          # Keep the bare site URL useful rather than a 404. Both a meta refresh
          # and a JS hop, so it works with scripting disabled; the visible link
          # is the fallback if neither fires.
          cat > "$GITHUB_WORKSPACE/_site/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>BX Agents Documentation</title>
            <meta http-equiv="refresh" content="0; url=./development/">
            <link rel="canonical" href="./development/">
            <script>location.replace("./development/")</script>
          </head>
          <body>
            <p>Redirecting to the <a href="./development/">BX Agents documentation</a>.</p>
          </body>
          </html>
          HTML

      - name: Fail if the build produced nothing
        run: |
          # bxDocs exits 0 having written an empty site if docs/ is empty or
          # misconfigured. A published-but-blank docs site is worse than a
          # failed build, so check for real output rather than trusting exit 0.
          test -f _site/development/index.html \
            || { echo "::error::_site/development/index.html missing - the docs build produced no site"; exit 1; }
          test -f _site/index.html \
            || { echo "::error::_site/index.html missing - neither main nor the redirect wrote a root page"; exit 1; }
          echo "Built $(find _site -name '*.html' | wc -l) HTML page(s)"
          find _site -maxdepth 1 -mindepth 1 | sort

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
