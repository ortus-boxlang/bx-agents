name: minimal-agent
description: "The smallest complete BX Agents project: one tool, one skill."
defaultProfile: local

profiles:
  local:
    provider: openai-compatible
    model: lfm3-1.7b
    options:
      baseURL: http://127.0.0.1:1234/v1
      timeout: 300
  gemma:
    provider: openai-compatible
    model: google/gemma-4-e2b
    options:
      baseURL: http://127.0.0.1:1234/v1
      timeout: 300

#usage: true
#notes: {}
