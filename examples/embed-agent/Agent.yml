name: embed-agent
description: A docs agent that visitors of another website chat with, through an embed.
model: mock/mock-model

# The admin signs in to the web app at /chat with this token (the page asks for it once). Visitors of the other website need no
# token: they use the public embed routes, which have their own checks. See docs/conventions/embeds.md.
agentApi:
  tokenEnvVar: EMBED_ADMIN_TOKEN
