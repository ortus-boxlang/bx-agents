name: api-agent
description: An agent that other programs call over its HTTP API, with access tokens an admin can manage.
model: mock/mock-model

# Every route of the agent API needs a token. TOKEN_FOR_ADMIN is the name of an environment
# variable holding an admin secret; `tokens: true` also accepts tokens made with
# `bxAgents token create`, and `manageTokens: true` lets an admin make and revoke them over the
# API itself (and from the Tokens panel of the web page). See docs/guides/agent-api.md.
agentApi:
  tokenEnvVar: TOKEN_FOR_ADMIN
  tokens: true
  manageTokens: true
