name: extensions-agent
description: "A project with extensions: commands you add to the chat, settings, and a scheduler."
model: mock/mock-model

# What an extension is told. Each block is the settings of the extension of that name,
# merged over the defaults its configure() set.
extensions:
  hello:
    greeting: Welcome aboard
  deploy:
    target: production
  standup:
    channel: team-standup
    at: "09:30"
  # disable: [ roll, "deploy:status" ]   # turn an extension, or one of its items, off
