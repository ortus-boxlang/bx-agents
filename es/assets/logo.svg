<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BxAgents">
	<title>BxAgents</title>
	<defs>
		<linearGradient id="bxa" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#58E06A"/>
			<stop offset="0.5" stop-color="#17D1C1"/>
			<stop offset="1" stop-color="#0A84FF"/>
		</linearGradient>
	</defs>

	<!-- dark plate + gradient frame -->
	<rect x="14" y="14" width="484" height="484" rx="86" fill="#050A12"/>
	<rect x="14" y="14" width="484" height="484" rx="86" fill="none" stroke="url(#bxa)" stroke-width="11"/>

	<!-- hexagon -->
	<path d="M258 60 L402 142 L402 306 L258 388 L114 306 L114 142 Z"
		fill="none" stroke="url(#bxa)" stroke-width="13" stroke-linejoin="round"/>

	<!-- antenna -->
	<circle cx="258" cy="98" r="17" fill="none" stroke="url(#bxa)" stroke-width="13"/>
	<path d="M258 115 L258 167" stroke="url(#bxa)" stroke-width="13" stroke-linecap="round"/>

	<!-- robot head -->
	<rect x="176" y="168" width="164" height="148" rx="44" fill="none" stroke="url(#bxa)" stroke-width="15"/>
	<rect x="200" y="192" width="116" height="100" rx="26" fill="#050A12"/>
	<rect x="222" y="218" width="22" height="48" rx="11" fill="url(#bxa)"/>
	<rect x="272" y="218" width="22" height="48" rx="11" fill="url(#bxa)"/>

	<!-- braces -->
	<path d="M148 182 q-15 0 -15 19 v20 q0 19 -15 22 q15 3 15 22 v20 q0 19 15 19"
		fill="none" stroke="url(#bxa)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
	<path d="M368 182 q15 0 15 19 v20 q0 19 15 22 q-15 3 -15 22 v20 q0 19 -15 19"
		fill="none" stroke="url(#bxa)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

	<!-- wordmark -->
	<text x="256" y="450" text-anchor="middle"
		font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
		font-size="76" font-weight="700" letter-spacing="-2" fill="url(#bxa)">BxAgents</text>
</svg>
